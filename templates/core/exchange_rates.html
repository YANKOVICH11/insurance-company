{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Курсы валют НБРБ</h2>
    
    <table border="1" style="width:100%; border-collapse: collapse;">
        <thead>
            <tr><th>Валюта</th><th>Курс</th><th>Дата</th></tr>
        </thead>
        <tbody>
            {% for rate in rates %}
            <tr>
                <td>{{ rate.Cur_Abbreviation }}</td>
                <td>{{ rate.Cur_OfficialRate|floatformat:2 }} руб.</td>
                <td>{{ rate.Date|date:"d/m/Y" }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Нет данных</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
