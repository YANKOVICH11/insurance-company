{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>📖 Словарь терминов</h2>
    
    {% for term in terms %}
    <div style="margin-bottom: 20px; border-left: 3px solid #3498db; padding-left: 15px;">
        <h3 style="color: #2c3e50;">{{ term.term }}</h3>
        <p style="margin: 10px 0;">{{ term.definition }}</p>
        <small style="color: #999;">📅 Добавлено: {{ term.added_date|date:"d/m/Y" }}</small>
    </div>
    {% empty %}
    <p>Термины не добавлены.</p>
    {% endfor %}
</div>
{% endblock %}
