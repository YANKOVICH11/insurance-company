{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>📰 Новости компании</h2>
    
    {% for item in news %}
    <div style="border-bottom: 2px solid #eee; margin-bottom: 25px; padding-bottom: 20px; overflow: hidden;">
        {% if item.image %}
        <img src="{{ item.image.url }}" style="width: 250px; height: 160px; object-fit: cover; border-radius: 10px; float: left; margin-right: 20px;">
        {% endif %}
        <h3 style="color: #2c3e50;">{{ item.title }}</h3>
        <p style="color: #888;">📅 {{ item.published_date|date:"d/m/Y" }}</p>
        <p>{{ item.summary }}</p>
        <a href="{% url 'news_detail' item.id %}" class="btn">📖 Читать далее →</a>
    </div>
    {% empty %}
    <p>Новостей пока нет.</p>
    {% endfor %}
</div>
{% endblock %}
